name: Release

on:
  push:
    tags: ['v*']
  # Lets the pipeline be exercised without creating a tag; the release job is
  # skipped in that case, since GitHub releases need a tag to hang off. Also how
  # the auto-tag workflow starts a real release: a tag it pushed cannot trigger
  # this workflow on its own, so it dispatches it on the tag ref instead, and
  # every ref-keyed step below behaves as it would for a human-pushed tag.
  workflow_dispatch:

# Only the release job writes anything; the build jobs run third-party actions
# and package managers and have no business holding a write token.
permissions:
  contents: read

# A release must never be cancelled halfway: signing and notarization leave
# state behind on Apple's side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with .fvmrc
  FLUTTER_VERSION: 3.47.5

jobs:
  gate:
    name: Gate (version + lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          pubspec=$(grep -m1 '^version:' pubspec.yaml \
            | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')

          # Artifacts are named after pubspec.yaml while the release hangs off
          # the tag, so a disagreement between the two ships a release whose
          # files claim a different version than its title.
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF_NAME#v}"
              case "$tag" in
                # Reserved for exercising the pipeline: such a tag is not meant
                # to match pubspec.yaml, and its release is thrown away.
                0.0.0*)
                  echo "::warning::$GITHUB_REF_NAME is a pipeline test tag - version check skipped"
                  ;;
                "$pubspec")
                  ;;
                *)
                  echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $pubspec"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Not a tag - version check skipped"
              ;;
          esac

          echo "version=$pubspec" >> "$GITHUB_OUTPUT"
          echo "Building $pubspec from ref $GITHUB_REF_NAME"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Fetch dependencies
        run: flutter pub get

      - name: Code generation (freezed / json / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --reporter expanded

  macos-arm64:
    name: macOS (arm64)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      # A step's if: cannot read the secrets context, so the check happens in a
      # run: block instead. An unsigned macOS build is not shippable: other Macs
      # refuse it, and the updater would be handing users an app weaker than the
      # one they already run. Fail the release rather than publish one.
      - name: Require a signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::error::No Developer ID certificate (MACOS_CERT_P12). A macOS release must be signed and notarized."
            exit 1
          fi
          echo "Certificate present - building a signed, notarized DMG."

      - name: Install create-dmg
        run: brew install create-dmg

      # The repository carries a Podfile and no Package.swift, so CocoaPods is
      # what the project is actually built and tested with. Swift Package
      # Manager is a per-machine Flutter setting, and a runner that has it on
      # silently migrates the project and resolves a different dependency
      # graph than any developer sees locally.
      - name: Use CocoaPods, not Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # The certificate lives in a throwaway keychain for the length of the
      # job. It has to join the search list as well as become the default one:
      # codesign looks the identity up through the search list.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The substitution has to split into one argument per keychain, so
          # the usual quoting would be wrong here.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      # notarytool reads its credentials from a keychain profile, so the one
      # the build script expects is created here. This also fails early if the
      # credentials are wrong, before a 20 minute build.
      - name: Create notary profile
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials mergelio-ci \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_APP_PASSWORD"

      - name: Build signed & notarized DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PROFILE: mergelio-ci
        run: ./scripts/build-macos-dmg.sh "${{ needs.gate.outputs.version }}"

      # Picks up the DMG and the updater's zip alike.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*-macos-*
          retention-days: 7
          if-no-files-found: error

      # Takes the certificate and the notary profile with it, failure or not.
      - name: Tear down the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  # Flutter builds Windows only for the machine it runs on, so each architecture
  # is built on its own runner. Signing and packaging happen afterwards on x64
  # in the windows job: SimplySign Desktop installs a 64-bit virtual card driver,
  # and an x64 driver does not load on Windows on Arm.
  windows-build:
    name: Windows build (${{ matrix.arch }})
    needs: gate
    strategy:
      # One architecture failing should not cancel the other and lose its log.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The SDK archives Flutter publishes carry an x64 Dart. A git checkout
      # instead fetches the Dart SDK for the machine it first runs on.
      - name: Install Flutter SDK (git)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $sdk 'bin\flutter.bat') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-

      # TARGET_ARCH pins the output path, so a build that lands somewhere
      # unexpected fails as missing rather than picking up another Release
      # directory and failing later on its machine type.
      - name: Build the app
        shell: pwsh
        env:
          SKIP_PACKAGE: 1
          TARGET_ARCH: ${{ matrix.arch }}
        run: .\scripts\build-windows-installer.ps1 "${{ needs.gate.outputs.version }}"

      # Intermediate only: the release job downloads by platform name and never
      # picks these up.
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/runner/Release
          retention-days: 1
          if-no-files-found: error

  # Both architectures are packaged in one job so they share a single
  # SimplySign login. Each login spends a one-time code from the same TOTP
  # seed, and a second login inside the same 30 second window would present
  # a code that was already used.
  windows:
    name: Windows (x64, arm64)
    needs: [gate, windows-build]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x64
          path: build/windows/x64/runner/Release

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-arm64
          path: build/windows/arm64/runner/Release

      # A step's if: cannot read the secrets context, so the decision is turned
      # into an output here and the signing steps branch on that.
      - name: Look for a signing credential
        id: signing
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
        run: |
          count=0
          for v in "$CERTUM_USERNAME" "$CERTUM_TOTP_SECRET" "$CERTUM_CERT_SHA1"; do
            [ -n "$v" ] && count=$((count + 1))
          done
          case $count in
            3)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Certum credentials present - building a signed installer."
              ;;
            0)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No Certum credentials - publishing an unsigned installer."
              ;;
            *)
              # Half a configuration is a mistake, not a choice to ship unsigned.
              echo "::error::CERTUM_USERNAME, CERTUM_TOTP_SECRET and CERTUM_CERT_SHA1 must be set together."
              exit 1
              ;;
          esac

      # Installs SimplySign Desktop and logs it in with a one-time code derived
      # from the TOTP seed; the certificate then appears in the user's store
      # while the private key stays in Certum's cloud. Pinned to a commit, not
      # a tag: this step holds the seed, so what runs here must not be able to
      # change under us. Review the action's source before moving the pin.
      - name: Log in to Certum SimplySign
        id: certum
        if: steps.signing.outputs.enabled == 'true'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          cert_sha1: ${{ secrets.CERTUM_CERT_SHA1 }}

      # With WINDOWS_SIGN_SHA1 set the script signs every unsigned .exe and .dll
      # in the build before packing them, then has Inno Setup sign setup.exe and
      # the uninstaller, and fails unless the installer verifies. Left empty it
      # packages unsigned. Only the installer is published, so no zip is built.
      # TARGET_ARCH names the downloaded build, which need not match this
      # runner; the script checks the exe's machine type against it.
      - name: Build setup.exe (x64)
        shell: pwsh
        env:
          SKIP_BUILD: 1
          SKIP_ARCHIVE: 1
          TARGET_ARCH: x64
          WINDOWS_SIGN_SHA1: ${{ steps.certum.outputs.cert-thumbprint }}
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
        run: .\scripts\build-windows-installer.ps1 "${{ needs.gate.outputs.version }}"

      - name: Build setup.exe (arm64)
        shell: pwsh
        env:
          SKIP_BUILD: 1
          SKIP_ARCHIVE: 1
          TARGET_ARCH: arm64
          WINDOWS_SIGN_SHA1: ${{ steps.certum.outputs.cert-thumbprint }}
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
        run: .\scripts\build-windows-installer.ps1 "${{ needs.gate.outputs.version }}"

      # /pa checks against the default Authenticode policy, the one Windows
      # applies when a user runs the installer, independently of the script.
      # /tw turns a missing timestamp into exit code 2, which fails here: an
      # untimestamped signature stops validating the day the certificate expires.
      - name: Verify the installer signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $installers = @(Get-ChildItem "dist\*-windows-$arch-setup.exe")
            if ($installers.Count -ne 1) {
              Write-Error "Expected one $arch setup.exe in dist, found $($installers.Count)."
              exit 1
            }
            & $env:SIGNTOOL verify /pa /tw /v $installers[0].FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # Ends the SimplySign session and drops the certificate from the
      # runner's store, failure or not. Done inline rather than through the
      # action's own teardown script, whose path is an output a failed login
      # step may never have set.
      - name: Log out of Certum SimplySign
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*SimplySign*' } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue |
            Where-Object { $_.Issuer -like '*Certum*' } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host 'SimplySign session closed.'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*-windows-arm64-setup.exe
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }}, .deb)
    needs: gate
    strategy:
      # One architecture failing should not cancel the other and lose its log.
      fail-fast: false
      matrix:
        # Not the -latest images on purpose: 22.04 ships glibc 2.35, so the
        # binary also runs on Debian 12 and older Ubuntu. Built on 24.04 it
        # would not.
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The SDK archives Flutter publishes carry an x64 Dart. A git checkout
      # instead fetches the Dart SDK for the machine it first runs on.
      - name: Install Flutter SDK (git)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Build .deb
        run: ./scripts/build-linux-deb.sh "${{ needs.gate.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 7
          if-no-files-found: error

  fedora:
    name: Fedora (${{ matrix.arch }}, .rpm)
    needs: gate
    strategy:
      # One architecture failing should not cancel the other and lose its log.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # An RPM built on Ubuntu resolves against the wrong libraries and its
    # %{dist} tag would lie, so the build runs in the distribution it targets.
    # The image is multi-arch; the runner decides which one is pulled.
    runs-on: ${{ matrix.runner }}
    container: fedora:41
    timeout-minutes: 45
    steps:
      # Before checkout: the action needs git in the container, or it silently
      # falls back to downloading a tarball with no repository behind it.
      - name: Install build dependencies
        run: |
          dnf -y install \
            clang cmake ninja-build pkgconf-pkg-config gtk3-devel libnotify-devel \
            git curl tar xz zip unzip which rpm-build rpm-sign gnupg2 \
            glibc-devel findutils

      - uses: actions/checkout@v4

      # Checkout leaves the tree owned by a different user than the one running
      # the build, and git refuses to read a repository it does not trust.
      - name: Trust the checkout
        run: git config --global --add safe.directory '*'

      # subosito/flutter-action expects an apt-based image, so the SDK is
      # installed by hand here: unpacked from the release archive on x64, and
      # checked out from git on arm64, where the archive's x64 Dart cannot run.
      - name: Install Flutter SDK
        run: |
          if [ "${{ matrix.arch }}" = x64 ]; then
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            tar -xf /tmp/flutter.tar.xz -C /opt
            rm -f /tmp/flutter.tar.xz
          else
            git clone --depth 1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git /opt/flutter
            /opt/flutter/bin/flutter --version
          fi
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-fedora-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-fedora-

      - name: Look for a package signing key
        id: signing
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing key present - the .rpm will carry a signature."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key - publishing an unsigned .rpm."
          fi

      # The key lives in its own keyring under RUNNER_TEMP so nothing is left
      # behind in the image, and the fingerprint is read back from the keyring
      # rather than kept as a second secret that could drift out of sync.
      - name: Import the package signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LINUX_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"

          fingerprint=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr/{print $10; exit}')
          [ -n "$fingerprint" ] || { echo "No secret key imported"; exit 1; }

          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "RPM_SIGN_KEY=$fingerprint"
            echo "RPM_SIGN_PASSPHRASE_FILE=$RUNNER_TEMP/gpg-passphrase"
          } >> "$GITHUB_ENV"

      # The script signs the package itself when RPM_SIGN_KEY is set, and
      # refuses to finish if the signature did not make it into the header.
      - name: Build .rpm
        run: ./scripts/build-linux-rpm.sh "${{ needs.gate.outputs.version }}"

      - name: Drop the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/gpg-passphrase"

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-${{ matrix.arch }}
          path: dist/*.rpm
          retention-days: 7
          if-no-files-found: error

  release:
    name: Draft release
    needs: [macos-arm64, windows, linux, fedora]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # By platform name only, which leaves out the intermediate Windows
      # builds the packaging jobs were fed from.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{macos,windows,linux,fedora}-*'
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # One detached signature over the checksum file covers every artifact in
      # the release: verify the signature, then verify the files against it.
      # dpkg ignores signatures inside a .deb, so this is what Debian and Ubuntu
      # users actually have to check.
      - name: Look for a signing key
        id: signing
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key - the release ships checksums with no signature over them."
          fi

      - name: Sign the checksums
        if: steps.signing.outputs.enabled == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LINUX_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"

          gpg --batch --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/gpg-passphrase" \
            --armor --detach-sign \
            --output artifacts/SHA256SUMS.txt.asc artifacts/SHA256SUMS.txt

          gpg --verify artifacts/SHA256SUMS.txt.asc artifacts/SHA256SUMS.txt

      - name: Drop the signing key
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/gpg-passphrase"

      # Draft on purpose, and it stays that way: publishing is a deliberate
      # click after the artifacts have been checked by hand.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
