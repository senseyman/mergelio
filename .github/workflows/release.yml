name: Release

on:
  push:
    tags: ['v*']
  # Lets the pipeline be exercised without creating a tag. The release job is
  # skipped in that case — GitHub releases need a tag to hang off.
  workflow_dispatch:

permissions:
  contents: write

# A release must never be cancelled halfway: signing and notarization leave
# state behind on Apple's side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with .fvmrc
  FLUTTER_VERSION: 3.44.6

jobs:
  gate:
    name: Gate (version + lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec=$(grep -m1 '^version:' pubspec.yaml \
            | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')

          # TODO: re-enable once the workflow has been exercised on a throwaway
          # v0.0.0-ci tag. Until then the tag is free to disagree with
          # pubspec.yaml so the pipeline can be tested without a version bump.
          # if [ "$tag" != "$pubspec" ]; then
          #   echo "::error::tag $tag does not match pubspec version $pubspec"
          #   exit 1
          # fi

          echo "version=$pubspec" >> "$GITHUB_OUTPUT"
          echo "Building $pubspec from ref $GITHUB_REF_NAME"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Fetch dependencies
        run: flutter pub get

      - name: Code generation (freezed / json / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --reporter expanded

  macos-arm64:
    name: macOS (arm64)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Install create-dmg
        run: brew install create-dmg

      # The repository carries a Podfile and no Package.swift, so CocoaPods is
      # what the project is actually built and tested with. Swift Package
      # Manager is a per-machine Flutter setting, and a runner that has it on
      # silently migrates the project and resolves a different dependency
      # graph than any developer sees locally.
      - name: Use CocoaPods, not Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # The certificate lives in a throwaway keychain for the length of the
      # job. It has to join the search list as well as become the default one:
      # codesign looks the identity up through the search list.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      # notarytool reads its credentials from a keychain profile, so the one
      # the build script expects is created here. This also fails early if the
      # credentials are wrong, before a 20 minute build.
      - name: Create notary profile
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials mergelio-ci \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_APP_PASSWORD"

      - name: Build signed & notarized DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PROFILE: mergelio-ci
        run: ./scripts/build-macos-dmg.sh "${{ needs.gate.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*-macos-*.dmg
          retention-days: 7
          if-no-files-found: error

      # Takes the certificate and the notary profile with it, failure or not.
      - name: Tear down the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  windows-x64:
    name: Windows (x64)
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Only the installer is published, so the zip is not worth building.
      - name: Build setup.exe
        shell: pwsh
        env:
          SKIP_ARCHIVE: 1
        run: .\scripts\build-windows-installer.ps1 "${{ needs.gate.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  linux-x64:
    name: Linux (x64, .deb)
    needs: gate
    # Not ubuntu-latest on purpose: 22.04 ships glibc 2.35, so the binary also
    # runs on Debian 12 and older Ubuntu. Built on 24.04 it would not.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Build .deb
        run: ./scripts/build-linux-deb.sh "${{ needs.gate.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.deb
          retention-days: 7
          if-no-files-found: error

  release:
    name: Draft release
    needs: [macos-arm64, windows-x64, linux-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Draft on purpose, and it stays that way: publishing is a deliberate
      # click after the artifacts have been checked by hand.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
