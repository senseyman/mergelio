name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with .fvmrc
  FLUTTER_VERSION: 3.47.5

jobs:
  lint:
    name: Lint (format + analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Code generation (freezed / json / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

  test-shard:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failing file does not hide the others.
      fail-fast: false
      matrix:
        # Keep the count in sync with the TOTAL passed to test-shard.sh below.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Code generation (freezed / json / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # Split by file rather than with --total-shards, which still compiles
      # every test file in every shard.
      - name: Run unit & widget tests
        # The explicit shell adds pipefail: a failing split must fail the step,
        # not leave xargs running `flutter test` with no files — the whole suite.
        shell: bash
        run: scripts/test-shard.sh ${{ matrix.shard }} 4 | xargs flutter test --concurrency=4 --reporter expanded

  # One stable check name for branch protection, whatever the shard count.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.test-shard.result }}" = success
