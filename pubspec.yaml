name: mergelio
description: "Mergelio — free, cross-platform visual Git client."
publish_to: 'none'
version: 1.2.1+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # i18n message formatting
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1
  # Immutable models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Local storage (SQLite via drift)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # Desktop window
  window_manager: ^0.4.3
  # Native open-folder dialog
  file_selector: ^1.0.3
  # Typography
  google_fonts: ^6.2.1
  flutter_pty: ^0.4.2
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

# Per-OS app icons generated from the 1024px brand master (§4.8). Regenerate
# with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: ".docs/brand/logo_dark/mergelio-dark-icon.png"
  macos:
    generate: true
    image_path: ".docs/brand/logo_dark/mergelio-dark-icon.png"
  windows:
    generate: true
    image_path: ".docs/brand/logo_dark/mergelio-dark-icon.png"
    icon_size: 256
