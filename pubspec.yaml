name: mergelio
description: "Mergelio — free, cross-platform visual Git client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  # Immutable models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Local storage (SQLite via drift)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # Desktop window
  window_manager: ^0.4.3
  # Native open-folder dialog
  file_selector: ^1.0.3
  # Typography
  google_fonts: ^6.2.1
  flutter_pty: ^0.4.2
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
